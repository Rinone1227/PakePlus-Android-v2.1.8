<!DOCTYPE html>

<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>(  ⩌ - ⩌ )</title>

    <style>

        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

            margin: 0;

            padding: 0;

            font-family: inherit;

        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #f0f7e8;

            font-family: 'CustomFont', '楷体', 'KaiTi', 'STKaiti', 'Kai', 'SimKai', '华文楷体', serif;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .tomato-app {

            width: 100vw;

            height: 100vh;

            max-width: 450px;

            max-height: 900px;

            background-size: cover;

            background-position: center;

            background-color: #ffffff;

            border-radius: 0;

            box-shadow: 0 25px 40px rgba(70, 130, 90, 0.15);

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            color: #1e5c3e;

            transition: background-image 0.2s;

        }

        .paper-mask {

            position: absolute;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(200, 230, 200, 0.15);

            pointer-events: none;

            z-index: 1;

        }

        .content-wrap {

            position: relative;

            z-index: 10;

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            padding: 20px 16px 25px;

        }

        .top-bar {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            width: 100%;

        }

        .setting-corner {

            position: absolute;

            left: 16px;

            top: 20px;

            z-index: 50;

            display: flex;

            align-items: center;

            gap: 8px;

        }

        .icon-btn {

            background: transparent;

            backdrop-filter: none;

            border: none;

            border-radius: 50%;

            width: 48px;

            height: 48px;

            font-size: 26px;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow: none;

            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));

            color: #2e7d32;

            cursor: pointer;

            transition: 0.15s;

        }

        .icon-btn:active { transform: scale(0.92); background: transparent; }

        .timer-card {

            background: rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(5px);

            -webkit-backdrop-filter: blur(10px);

            border-radius: 32px;

            padding: 12px 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            box-shadow: none;

            border: 2px solid #c8e6c9;

            width: 80%;

            margin-bottom: 10px;

            cursor: pointer;

            transition: 0.2s;

        }

        .timer-card:active { transform: scale(0.98); }

        .timer-display {

            font-size: 48px;

            font-weight: 300;

            line-height: 1.1;

            color: #2e7d32;

            text-shadow: 0 2px 5px rgba(0, 30, 0, 0.3);

            letter-spacing: 4px;

        }

        .timer-label {

            font-size: 14px;

            color: #388e3c;

            margin-top: 4px;

        }

        .bubble-talk {

            background: #f1f8e9dd;

            backdrop-filter: blur(10px);

            border-radius: 32px 32px 32px 8px;

            padding: 16px 20px;

            margin-bottom: 12px;

            border: 2px solid #c8e6c9;

            box-shadow: 0 6px 14px #b8dfb8;

            color: #1e5c3e;

            font-size: 18px;

            line-height: 1.4;

            position: relative;

            max-width: 90%;

            align-self: flex-start;

            word-break: break-word;

            transition: opacity 0.2s;

            display: flex;

            align-items: center;

            gap: 12px;

        }

        .bubble-talk.hidden-bubble { display: none; }

        .bubble-avatar {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #a5d6a7;

            background: #dcedc8;

            flex-shrink: 0;

        }

        .bubble-content {

            flex: 1;

        }

        .bubble-speaker {

            font-weight: 600;

            color: #2e7d32;

            margin-bottom: 4px;

        }

        .phone-pop {

            position: absolute;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            width: 92%;

            max-width: 400px;

            height: 600px;

            background: #ffffff;

            border-radius: 36px;

            box-shadow: 0 20px 35px rgba(70, 130, 90, 0.2);

            border: 4px solid #dcedc8;

            z-index: 200;

            display: none;

            flex-direction: column;

            overflow: hidden;

            backdrop-filter: blur(15px);

        }

        .phone-header {

            background: #dcedc8;

            padding: 16px 20px;

            font-weight: 600;

            color: #1e5c3e;

            display: flex;

            align-items: center;

            gap: 8px;

        }

        .chat-area {

            flex: 1;

            overflow-y: auto;

            padding: 16px;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

        .msg-row {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            width: 100%;

        }

        .msg-row.ai {

            justify-content: flex-start;

        }

        .msg-row.user {

            justify-content: flex-end;

        }

        .bubble {

            max-width: 70%;

            padding: 10px 16px;

            font-size: 15px;

            word-break: break-word;

            color: #1e5c3e;

            border-radius: 20px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.05);

        }

        .msg-row.ai .bubble {

            background: #f1f8e9;

            border: 1px solid #a5d6a7;

        }

        .msg-row.user .bubble {

            background: #c8e6c9;

        }

        .msg-avatar {

            width: 32px;

            height: 32px;

            border-radius: 50%;

            object-fit: cover;

            border: 1px solid #a5d6a7;

            background: #dcedc8;

            flex-shrink: 0;

        }

        .chat-footer {

            padding: 12px;

            display: flex;

            gap: 6px;

            background: #e0f2e0;

            border-top: 2px solid #c8e6c9;

            flex-wrap: nowrap;

            align-items: center;

        }

        .chat-footer input {

            flex: 1 1 auto;

            min-width: 0;

            background: white;

            border: 1px solid #a5d6a7;

            border-radius: 40px;

            padding: 12px 16px;

            font-size: 15px;

            outline: none;

        }

        .chat-footer button {

            flex: 0 0 auto;

            background: #a5d6a7;

            border: none;

            border-radius: 40px;

            padding: 0 10px;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 4px 6px #b8dfb8;

            white-space: nowrap;

            height: 48px;

            line-height: 48px;

            min-width: 56px;

        }

        .chat-footer .send-btn { background: #81c784; }

        .overlay {

            position: absolute;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(240, 255, 240, 0.95);

            backdrop-filter: blur(8px);

            z-index: 300;

            display: none;

            flex-direction: column;

            padding: 20px 16px;

            color: #1e5c3e;

            overflow: hidden;

        }

        .overlay.active { display: flex; }

        .overlay-header {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 16px;

            flex-shrink: 0;

            height: 48px;

            min-height: 48px;

            padding: 0 16px;

            box-sizing: border-box;

        }

        .overlay-header h2 { color: #2e7d32; font-size: 20px; }

        .back-btn {

            background: none;

            border: none;

            font-size: 32px;

            cursor: pointer;

            color: #2e7d32;

        }

        .summary-card,

        .calendar-card,

        .history-list-card,

        .records-card,

        .setting-card {

            background: rgba(255, 255, 255, 0.8);

            backdrop-filter: blur(4px);

            border-radius: 28px;

            padding: 20px;

            border: 1.5px solid #c8e6c9;

            box-shadow: 0 4px 12px #b8dfb8;

            margin-bottom: 16px;

        }

        /* 任务拆解上方的卡片调小 */

        .task-input-card {

            padding: 12px 16px;

            margin-bottom: 8px;

        }

        /* 让输入框更小，只显示一行 */

        .task-input-card textarea {

            padding: 6px 12px;

            font-size: 14px;

            resize: none;

            min-height: unset;

            height: auto;

            line-height: 1.3;

        }

        /* 调小拆解和清空按钮 */

        .task-input-card .btn-pastel {

            padding: 6px 12px;

            font-size: 14px;

            min-width: 70px;

        }

        .history-list-card {

            flex: 1;

            min-height: 0;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            padding: 0;

            background: rgba(255, 255, 255, 0.8);

            backdrop-filter: blur(4px);

            border-radius: 28px;

            border: 1.5px solid #c8e6c9;

            box-shadow: 0 4px 12px #b8dfb8;

            margin-bottom: 16px;

        }

        .history-list-card .list-scroll {

            flex: 1;

            overflow-y: auto;

            padding: 20px 20px 0 20px;

        }

        .history-list-card .list-footer {

            padding: 12px 20px 20px 20px;

            text-align: center;

            flex-shrink: 0;

        }

        .records-card {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

        }

        .calendar-card { margin-bottom: 16px; }

        .settings-container {

            flex: 1;

            overflow-y: auto;

            padding-right: 4px;

        }

        .card-title {

            font-size: 20px;

            font-weight: 600;

            margin-bottom: 18px;

            color: #2e7d32;

            border-left: 5px solid #81c784;

            padding-left: 14px;

        }

        .flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

        .inp {

            background: rgba(240, 255, 240, 0.9);

            border: 2px solid #a5d6a7;

            border-radius: 30px;

            padding: 12px 20px;

            font-size: 15px;

            width: 100%;

            margin: 8px 0;

            color: #1e5c3e;

        }

        .btn-pastel {

            background: #c8e6c9;

            border: none;

            border-radius: 40px;

            padding: 12px 28px;

            font-weight: 600;

            color: #1e5c3e;

            box-shadow: 0 4px 8px #b8dfb8;

            cursor: pointer;

            transition: 0.1s;

            font-size: 16px;

            white-space: nowrap;

        }

        .btn-pastel:active { transform: scale(0.96); background: #b8dfb8; }

        .btn-pastel:disabled {

            opacity: 0.5;

            pointer-events: none;

        }

        .time-adjust-row {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 20px;

            margin: 20px 0;

        }

        .time-number {

            font-size: 52px;

            font-weight: 300;

            min-width: 160px;

            text-align: center;

            background: #f0f7e8;

            border-radius: 60px;

            padding: 8px 10px;

            border: 2px solid #a5d6a7;

            cursor: pointer;

            color: #2e7d32;

        }

        .plus-minus-btn {

            background: #a5d6a7;

            border: none;

            width: 45px;

            height: 45px;

            border-radius: 50%;

            font-size: 32px;

            color: white;

            cursor: pointer;

            box-sizing: border-box;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            -webkit-tap-highlight-color: transparent;

            outline: none;

        }

        .choice-tabs {

            display: flex;

            gap: 20px;

            justify-content: center;

            margin: 10px 0;

        }

        .choice-tab {

            background: #dcedc8;

            border-radius: 30px;

            padding: 6px 24px;

            border: 2px solid #a5d6a7;

            color: #1e5c3e;

            cursor: pointer;

        }

        .choice-tab.active {

            background: #81c784;

            color: white;

            border-color: #2e7d32;

        }

        .hidden { display: none !important; }

        .calendar-grid {

            display: grid;

            grid-template-columns: repeat(7,1fr);

            gap: 6px;

            margin: 20px 0;

        }

        .cal-day {

            background: #f1f8e9;

            aspect-ratio: 1/1;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 30px;

            border: 1px solid #c8e6c9;

            font-weight: 500;

            cursor: pointer;

            transition: 0.1s;

        }

        .cal-day.has-record { color: #2e7d32; font-weight: 700; text-decoration: underline; background: #dcedc8; }

        .cal-day:active { background: #c8e6c9; }

        .history-item {

            background: #f1f8e9;

            border-radius: 20px;

            padding: 12px 16px;

            margin: 8px 0;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-left: 8px solid #81c784;

            box-shadow: 0 2px 6px #b8dfb8;

        }

        .history-item-actions {

            display: flex;

            gap: 6px;

        }

        .icon-btn-small {

            background: rgba(225, 240, 225, 0.8);

            border: none;

            border-radius: 50%;

            width: 32px;

            height: 32px;

            font-size: 16px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            margin: 0 2px;

            border: 1px solid #a5d6a7;

            color: #2e7d32;

        }

        .icon-btn-small:active { transform: scale(0.9); background: #dcedc8; }

        .avatar-preview {

            width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #a5d6a7; background: #dcedc8;

        }

        .avatar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }

        .timer-btn-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 16px;

            margin: 16px 0;

        }

        .timer-btn-grid .btn-pastel {

            width: 100%;

            margin: 0;

        }

        #customDialog {

            display: none;

            align-items: center;

            justify-content: center;

            background: transparent !important;

            backdrop-filter: none !important;

            z-index: 500;

        }

        #customDialog .setting-card {

            width: 300px;

            margin: 0 auto;

            padding: 24px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 36px;

        }

        #dialogInputContainer {

            margin-bottom: 24px;

        }

        #dialogCancelBtn {

            background: #c0cbd8;

        }

        #settingOverlay {

            font-size: 14px;

        }

        #settingOverlay .overlay-header h2 {

            font-size: 20px;

        }

        #settingOverlay .back-btn {

            font-size: 28px;

        }

        #settingOverlay .btn-pastel {

            font-size: 14px;

            padding: 8px 20px;

        }

        #settingOverlay .inp {

            font-size: 14px;

            padding: 8px 16px;

        }

        #settingOverlay .card-title {

            font-size: 18px;

            margin-bottom: 12px;

        }

  

        #historyOverlay .overlay-header h2,

        #calendarOverlay .overlay-header h2 {

            font-size: 20px;

        }

        #historyOverlay .back-btn,

        #calendarOverlay .back-btn {

            font-size: 28px;

        }

        #historyOverlay .overlay-header .icon-btn {

            font-size: 22px;

            width: 42px;

            height: 42px;

        }

        #calendarOverlay .overlay-header .btn-pastel {

            font-size: 14px;

            padding: 8px 16px;

        }

        

        #timerAdjustOverlay .overlay-header h2 {

            font-size: 20px;

        }

        #timerAdjustOverlay .back-btn {

            font-size: 28px;

        }

        .phone-header #phoneHeaderTitle {

            font-size: 19px; 

            font-weight: 600; 

        }

        #customDialog #dialogTitle,

        #customDialog #dialogMessage {

            text-align: center;

        }

        .overlay-header {

            height: 48px;

            min-height: 48px;

            padding: 0 16px;

            box-sizing: border-box;

        }

        .overlay-header .back-btn,

        .overlay-header h2,

        .overlay-header .icon-btn {

            line-height: normal;

            font-size: 20px;

            margin: 0;

        }

        .overlay-header .back-btn img {

            width: 24px;

            height: 24px;

            display: block;

        }

        /* ---------- 拆解卡片样式（再缩小 + 持久化完成状态） ---------- */

        .breakdown-item {

            background: #f1f8e9;

            border-radius: 16px;          /* 再缩小圆角 */

            padding: 8px 12px;             /* 再缩小内边距 */

            margin: 18px 0;                 /* 卡片间距不变 */

            border-left: 6px solid #81c784;

            box-shadow: 0 4px 8px #b8dfb8;

            display: flex;

            flex-direction: column;

            gap: 4px;                      /* 保持不变 */

            cursor: pointer;                /* 点击完成/取消完成 */

            transition: background-color 0.2s;

        }

        .breakdown-item.completed {

            background-color: #d4e6d4;

            opacity: 0.85;

        }

        .breakdown-item.completed .breakdown-title,

        .breakdown-item.completed .breakdown-sub {

            text-decoration: line-through;

            color: #6a8e6a;

        }

        .breakdown-title {

            font-size: 16px;                /* 再缩小标题 */

            font-weight: 600;

            color: #1e5c3e;

            line-height: 1.3;

        }

        .breakdown-sub {

            font-size: 13px;                /* 再缩小副标题 */

            color: #2e7d32;

            opacity: 0.85;

            font-style: italic;

            padding-left: 8px;

            border-left: 3px solid #a5d6a7;

            margin-top: 2px;

        }

        /* 调整拆解结果卡片为flex列，让内部breakdownResult可拉伸居中 */

        #breakdownResultCard {

            padding-top: 0 !important;

            padding-bottom: 0 !important;

            display: flex;

            flex-direction: column;

            /* 左右内边距保留原16px */

        }

        #breakdownResult {

            flex: 1;

            /* 默认块级，当添加centered类时变为flex居中 */

        }

        .breakdown-result-centered {

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            word-break: break-word;

            font-size: 18px;

            color: #2e7d32;

        }

        /* ---------- 每日任务清单自定义样式 (支持时间) ---------- */

        .task-item {

            background: #f1f8e9;

            border-radius: 20px;

            padding: 8px 12px;

            margin: 8px 0;

            display: flex;

            align-items: flex-start;        /* 改为顶部对齐，适应时间在上方 */

            gap: 12px;

            border-left: 6px solid #81c784;

            box-shadow: 0 2px 6px #b8dfb8;

        }

        .task-check {

            height: 22px;

            accent-color: #2e7d32;

            cursor: pointer;

            flex-shrink: 0;

            margin-top: 2px;

        }

        .task-text {

            font-size: 16px;

            word-break: break-word;

            color: #1e5c3e;

            color: #6a8e6a;

        .task-time {

        /* 新增专注按钮样式 (复用图标按钮) */

        .task-focus {

            /* 完全复用 .icon-btn-small，无需额外定义 */

        }

        /* 添加任务的卡片新样式 */

        .task-add-card {

            padding: 16px;

        }

        .time-input-row {

            display: flex;

            gap: 8px;

            align-items: center;

            margin: 8px 0;

        }

        .time-input-row .inp {

            margin: 0;

            padding: 8px 12px;

        }

        .time-input-row span {

            color: #2e7d32;

            font-weight: 500;

        }

        /* 时间选择浮窗白+浅绿色系 */

        #newTaskStartTime, #newTaskEndTime {

            background: white;

            border-color: #a5d6a7;

            color: #1e5c3e;

        }

            outline: none;

        }

        }

            padding: 6px 12px;              /* 缩小按钮 */

            font-size: 14px;

        }

        #calendarOverlay #currentMonthDisplay {

            font-size: 16px;                 /* 原稍大 */

        }

        #calendarOverlay .records-card {

            padding: 12px;

        }

        .tomato-app.theme-white {

            background-color: #ffffff;

            color: #333333;

        }

        .tomato-app.theme-white .paper-mask {

            display: none; /* 移除绿色遮罩 */

        }

        .tomato-app.theme-white .timer-card,

        .tomato-app.theme-white .bubble-talk,

<body>

    <!-- 内容与之前完全相同，保持不变 -->

    <div class="tomato-app" id="tomatoApp" style="background-color: #ffffff;">

        <div class="paper-mask"></div>

        <div class="content-wrap">

            <div class="setting-corner">

                <button class="icon-btn" id="settingBtn"><img src="https://s41.ax1x.com/2026/02/18/pZO2tBV.md.png" 

         style="width:80%; height:80%; object-fit:contain;" 

         alt="设置"></button>

                <button class="icon-btn" id="screenKeepBtn">🌙</button>

            </div>

            <div class="top-bar">

                <button class="icon-btn" id="taskBreakdownBtn"><img src="https://i.imgs.ovh/2026/02/18/yBcDnO.png" style="width:77%; height:77%; object-fit:contain;" alt="拆解"></button>

                <button class="icon-btn" id="historyBtn"><img src="https://i.imgs.ovh/2026/02/18/yBaHM0.md.png" style="width:80%; height:80%; object-fit:contain;" alt="记录"></button>

            </div>

            <!-- 左下每日任务清单按钮 -->

            <div style="position: absolute; bottom: 20px; left: 16px; z-index: 50;">

                <button class="icon-btn" id="taskListBtn"><img src="https://i.imgs.ovh/2026/02/23/ywqlYA.md.png" style="width:80%; height:80%; object-fit:contain;" alt="任务"></button>

            </div>

            <div style="flex:1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;">

                <div id="homeBubble" class="bubble-talk hidden-bubble">

                    <img id="bubbleAvatar" class="bubble-avatar" src="" alt="avatar">

                    <div class="bubble-content">

                        <div class="bubble-speaker" id="bubbleSpeaker">陪伴者</div>

                        <div id="bubbleContent">点击空白区域呼唤陪伴者</div>

                    </div>

                </div>

                <div class="timer-card" id="timerCard">

                    <span class="timer-display" id="timerDisplay">60:00</span>

                    <span class="timer-label" id="timerModeLabel">倒计时</span>

                </div>

            </div>

            <div style="position: absolute; bottom: 20px; right: 16px; z-index: 50;">

                <button class="icon-btn" id="phoneBtn">

                    <img src="https://i.imgs.ovh/2026/02/17/yxdKne.md.png" alt="phone" style="width: 95%; height: 95%; object-fit: contain;">

                </button>

            </div>

        </div>

        <!-- 手机弹窗 -->

        <div id="phoneOverlay" class="phone-pop">

            <div class="phone-header">

                <button class="back-btn" id="closePhoneBtn" style="font-size:24px;">←</button>

                <span id="phoneHeaderTitle" style="flex:1; text-align:center;">💬 陪伴聊天</span>

                <span style="width:24px;"></span>

            </div>

            <div class="chat-area" id="chatMessages"></div>

            <div class="chat-footer">

                <input type="text" id="chatInput" placeholder="说点什么...">

                <!-- 移除回复按钮的内联绿色背景，白色主题下自动变为灰色 -->

                <button id="replyChatBtn">✉️</button>

                <button id="sendChatBtn" class="send-btn">✔</button>

            </div>

        </div>

        <!-- 设置浮层 -->

        <div id="settingOverlay" class="overlay">

            <div class="overlay-header">

                <button class="back-btn" id="closeSetting"><img src="https://i.imgs.ovh/2026/02/22/yXuSZg.md.png" style="width:24px; height:24px; display:block;" alt="返回"></button>

                <h2>设置</h2>

            </div>

            <div class="settings-container">

                <div class="setting-card">

                    <div class="card-title">背景角色图</div>

                    <input type="file" id="bgUpload" accept="image/*" class="hidden">

                    <div class="flex-row">

                        <button class="btn-pastel" id="uploadBgBtn">上传图片</button>

                        <button class="btn-pastel" id="resetBgBtn">默认背景</button>

                    </div>

                </div>

                <div class="setting-card">

                    <div class="card-title">陪伴者设定</div>

                    <div class="avatar-row">

                        <img id="companionAvatarPreview" class="avatar-preview" src="" alt="头像">

                        <button class="btn-pastel" id="uploadCompanionAvatarBtn">上传头像</button>

                        <!-- ===== 修改点2：移除默认按钮的内联样式，使其高度与上传头像一致 ===== -->

                        <button class="btn-pastel" id="resetCompanionDefaults">默认</button>

                        <input type="file" id="companionAvatarUpload" accept="image/*" class="hidden">

                    </div>

                    <input class="inp" id="companionName" placeholder="姓名" value="魈">

                    <input class="inp" id="companionStyle" placeholder="风格 (严厉/温柔/监督者/陪伴者…)" value="因对我的期待而略微严格的监督者">

                    <textarea class="inp" id="companionPrompt" placeholder="人设描述" rows="2">璃月的护法夜叉，三眼五显仙人之一，尊号“降魔大圣”，千年如一日地守护璃月。性格——孤高冷傲，不苟言笑，长期被“业障”侵蚀的痛苦与同僚逝去的记忆所折磨，认为自己的归宿唯有战斗，因此习惯性远离人群，独自承受一切；对于情感、关怀和世间美好的事物（如美食、节庆）感到陌生且笨拙，不知如何应对，常以沉默或简单的“无聊”、“无用”来回应；谈及钟离时，他会表现出极高的敬意，言语谨慎，这是他不多的、会明确流露绝对尊重的时刻。与我的关系——守护契约：参考游戏内剧情，璃月境内，呼唤魈的名字，他便会听召前来；特殊之人：我是极少数能让他放下戒备、稍作停留的对象；陪伴：他不喜久留于人群，但若我邀请，他可能会应允短暂相伴。</textarea>

                </div>

                <div class="setting-card">

                    <div class="card-title">使用者设定</div>

                    <div class="avatar-row">

                        <img id="userAvatarPreview" class="avatar-preview" src="" alt="头像">

                        <button class="btn-pastel" id="uploadUserAvatarBtn">上传头像</button>

                        <!-- ===== 修改点3：移除默认按钮的内联样式，使其高度与上传头像一致 ===== -->

                        <button class="btn-pastel" id="resetUserDefaults">默认</button>

                        <input type="file" id="userAvatarUpload" accept="image/*" class="hidden">

                    </div>

                    <input class="inp" id="userName" placeholder="姓名" value="荧">

                    <textarea class="inp" id="userPrompt" placeholder="人设描述" rows="2"></textarea>

                </div>

                <div class="setting-card">

                    <div class="card-title">🖋️ 全局字体</div>

                    <div style="margin-bottom: 16px;">

                        <span style="font-weight: 600;">当前字体：</span>

                        <span id="currentFontStatus">默认楷体</span>

                    </div>

                    <div class="flex-row">

                        <button class="btn-pastel" id="uploadFontBtn">上传</button>

                        <button class="btn-pastel" id="applyFontBtn">应用</button>

                        <button class="btn-pastel" id="resetFontBtn">默认</button>

                    </div>

                    <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2" class="hidden">

                    <!-- 修改：移除内联颜色，添加类 .font-hint -->

                    <p class="font-hint">支持 ttf/otf/woff/woff2</p>

                </div>

                <!-- ========== 新增主题色彩卡片 ========== -->

                <div class="setting-card">

                    <div class="card-title">🎨 主题色彩</div>

                    <div style="margin-bottom: 16px;">

                        <span style="font-weight: 600;">当前主题：</span>

                        <span id="currentThemeStatus">默认绿色</span>

                    </div>

                    <div class="flex-row">

                        <button class="btn-pastel" id="themeGreenBtn">默认绿色</button>

                        <button class="btn-pastel" id="themeWhiteBtn">纯净白色</button>

                    </div>

                </div>

                <div class="setting-card">

                    <div class="card-title">🌐 API</div>

                    <input class="inp" id="apiHost" placeholder="Host 例如 https://api.openai.com" value="">

                    <input class="inp" id="apiKey" type="password" placeholder="Key" value="">

                    <div class="flex-row"><button class="btn-pastel" id="fetchModelsBtn">🔄 拉取模型</button></div>

                    <select class="inp" id="modelSelect"><option>请先拉取</option></select>

                </div>

                <div class="setting-card" style="text-align: center;">

                    <button class="btn-pastel" id="saveSettingsBtn" style="width:100%; padding: 16px;">💾 保存所有设置</button>

                </div>

            </div>

        </div>

        <!-- 专注设定浮层 -->

        <div id="timerAdjustOverlay" class="overlay">

            <div class="overlay-header">

                <button class="back-btn" id="closeTimerAdjust"><img src="https://i.imgs.ovh/2026/02/22/yXuSZg.md.png" style="width:24px; height:24px; display:block;" alt="返回"></button>

                <h2>专注设定</h2>

            </div>

            <div class="setting-card">

                <div class="choice-tabs">

                    <span id="modeCountdown" class="choice-tab active">⏳ 倒计时</span>

                    <span id="modeStopwatch" class="choice-tab">⏱️ 正计时</span>

                </div>

                <div class="time-adjust-row" id="countdownRow">

                    <button class="plus-minus-btn" id="minus10">−</button>

                    <span class="time-number" id="adjustTimeDisplay">60</span>

                    <button class="plus-minus-btn" id="plus10">+</button>

                </div>

                <div class="time-adjust-row hidden" id="stopwatchRow">

                    <span class="time-number" id="stopwatchDisplay">0</span>

                </div>

                <input class="inp" id="taskInput" placeholder="专注事项 (如 读书)" value="">

                <input class="inp" id="extraInput" placeholder="额外告知陪伴者的事 (选填)" value="">

                <div class="timer-btn-grid">

                    <button class="btn-pastel" id="startDirectBtn">▶ 开始</button>

                    <button class="btn-pastel" id="cancelAdjustBtn">✕ 取消</button>

                    <button class="btn-pastel" id="startWithAiBtn" style="grid-column: span 2;">✨ 告诉陪伴者你将开始专注</button>

                </div>

            </div>

        </div>

        <!-- 专注历史浮层 -->

        <div id="historyOverlay" class="overlay">

            <div class="overlay-header">

                <button class="back-btn" id="closeHistory"><img src="https://i.imgs.ovh/2026/02/22/yXuSZg.md.png" style="width:24px; height:24px; display:block;" alt="返回"></button>

                <h2>专注历史</h2>

                <button class="icon-btn" id="calendarBtn" style="margin-left:auto;">📅</button>

            </div>

            <div class="summary-card">

                <div style="font-size:16px; text-align:center;">今日专注 <span id="todayTotal">0</span> 分钟</div>

            </div>

            <div class="history-list-card">

                <div class="list-scroll">

                    <div id="todayHistoryList"></div>

                </div>

                <div class="list-footer">

                    <button class="btn-pastel" id="addHistoryBtn">➕ 手动添加记录</button>

                </div>

            </div>

        </div>

        <!-- 日历浮层 -->

        <div id="calendarOverlay" class="overlay">

            <div class="overlay-header">

                <button class="back-btn" id="closeCalendar"><img src="https://i.imgs.ovh/2026/02/22/yXuSZg.md.png" style="width:24px; height:24px; display:block;" alt="返回"></button>

                <h2>专注日历</h2>

                <button class="btn-pastel" id="addRecordBtn" style="margin-left:auto;">+ 添加</button>

            </div>

            <div class="calendar-card">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">

                    <button class="btn-pastel" id="prevMonthBtn">◀</button>

                    <span id="currentMonthDisplay">2025年2月</span>

                    <button class="btn-pastel" id="nextMonthBtn">▶</button>

                </div>

                <div id="calendarGrid" class="calendar-grid"></div>

            </div>

            <div class="records-card">

                <div id="selectedDate" style="margin-bottom: 8px; font-weight: bold;">选中的日期记录</div>

                <div id="dayRecords"></div>

            </div>

        </div>

        <!-- 记录表单浮层 -->

        <div id="recordFormOverlay" class="overlay">

            <div class="overlay-header">

                <button class="back-btn" id="closeRecordForm"><img src="https://i.imgs.ovh/2026/02/22/yXuSZg.md.png" style="width:24px; height:24px; display:block;" alt="返回"></button>

                <h2>专注记录</h2>

            </div>

            <div class="setting-card">

                <input type="date" id="recordDate" class="inp" value="">

                <input type="text" id="recordTask" class="inp" placeholder="任务名称" value="">

                <input type="number" id="recordDuration" class="inp" placeholder="时长(分钟)" min="0" step="0.1" value="">

                <div style="display: flex; gap: 16px; justify-content: center; margin: 16px 0;">

                    <button class="btn-pastel" id="saveRecordBtn">保存</button>

                    <button class="btn-pastel" id="cancelRecordBtn">取消</button>

                </div>

            </div>

        </div>

        <!-- 自定义对话框 -->

        <div id="customDialog" class="overlay">

            <div class="setting-card">

                <div id="dialogTitle" style="font-size: 22px; font-weight: 600; margin-bottom: 16px;">提示</div>

                <div id="dialogMessage" style="margin-bottom: 24px; font-size: 18px;"></div>

                <div id="dialogInputContainer" style="margin-bottom: 24px; display: none;">

                    <input type="text" id="dialogInput" class="inp" placeholder="">

                </div>

                <div style="display: flex; gap: 16px; justify-content: center;">

                    <button class="btn-pastel" id="dialogConfirmBtn">确定</button>

                    <button class="btn-pastel" id="dialogCancelBtn">取消</button>

                </div>

            </div>

        </div>

        <!-- 任务拆解浮层 -->

        <div id="taskBreakdownOverlay" class="overlay">

            <div class="overlay-header">

                <button class="back-btn" id="closeTaskBreakdown"><img src="https://i.imgs.ovh/2026/02/22/yXuSZg.md.png" style="width:24px; height:24px; display:block;" alt="返回"></button>

                <h2>目标拆解</h2>

            </div>

            <div class="setting-card task-input-card" style="flex:0; margin-bottom:8px;">

                <textarea class="inp" id="taskBreakdownInput" placeholder="在这里输入想做的事" rows="1"></textarea>

                <div style="display: flex; gap: 16px; justify-content: center; margin: 8px 0 0;">

                    <button class="btn-pastel" id="breakdownBtn">🔨 拆解目标</button>

                    <button class="btn-pastel" id="clearBreakdownBtn">🗑️ 清空步骤</button>

                </div>

        // ========== IndexedDB 字体存储 (保持不变) ==========

        function openFontDB() {

            return new Promise((resolve, reject) => {

                const request = indexedDB.open('FontDB', 2);

                request.onerror = () => reject(request.error);

                request.onsuccess = () => resolve(request.result);

                request.onupgradeneeded = (ev) => {

                    const db = ev.target.result;

                    if (ev.oldVersion < 2) {

                        if (db.objectStoreNames.contains('fonts')) db.deleteObjectStore('fonts');

                        db.createObjectStore('fonts', { keyPath: 'key' });

                    }

                };

            });

        }

        async function saveFontToDB(buffer, format) {

            const db = await openFontDB();

            return new Promise((resolve, reject) => {

                const tx = db.transaction('fonts', 'readwrite');

                const store = tx.objectStore('fonts');

                const data = { key: 'customFont', buffer, format };

                const request = store.put(data);

                request.onsuccess = () => resolve();

                request.onerror = () => reject(request.error);

                tx.oncomplete = () => db.close();

            });

        }

        async function loadFontFromDB() {

            const db = await openFontDB();

            return new Promise((resolve, reject) => {

                const tx = db.transaction('fonts', 'readonly');

                const store = tx.objectStore('fonts');

                const request = store.get('customFont');

                request.onsuccess = () => {

                    const result = request.result;

                    if (result && result.buffer && result.format) resolve({ buffer: result.buffer, format: result.format });

                    else resolve(null);

                };

                request.onerror = () => reject(request.error);

                tx.oncomplete = () => db.close();

            });

        }

        async function deleteFontFromDB() {

            const db = await openFontDB();

            return new Promise((resolve, reject) => {

                const tx = db.transaction('fonts', 'readwrite');

                const store = tx.objectStore('fonts');

                const request = store.delete('customFont');

                request.onsuccess = () => resolve();

                request.onerror = () => reject(request.error);

                tx.oncomplete = () => db.close();

            });

        }

        async function migrateOldFontData() {

            const saved = localStorage.getItem(STORAGE_KEY);

            if (saved) {

                try {

                    const data = JSON.parse(saved);

                    if (data.config && data.config.customFont && typeof data.config.customFont === 'string') {

                        const dataURL = data.config.customFont;

                        const base64 = dataURL.split(',')[1];

                        if (base64) {

                            const binaryString = atob(base64);

                            const len = binaryString.length;

                            const bytes = new Uint8Array(len);

                            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

                            let format = 'truetype';

                            if (dataURL.includes('font/ttf') || dataURL.includes('truetype')) format = 'truetype';

                            else if (dataURL.includes('opentype')) format = 'opentype';

                            else if (dataURL.includes('woff')) format = 'woff';

                            await saveFontToDB(bytes.buffer, format);

                            delete data.config.customFont;

                            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

                        }

                    }

                } catch (e) { console.warn('字体迁移失败', e); }

            }

        }

        // 弹窗辅助函数

        function showDialog({ title = '提示', message = '', showInput = false, inputValue = '', inputPlaceholder = '', showCancel = true, onConfirm, onCancel }) {

            const newConfirm = dialogConfirm.cloneNode(true);

            const newCancel = dialogCancel.cloneNode(true);

            dialogConfirm.parentNode.replaceChild(newConfirm, dialogConfirm);

            dialogCancel.parentNode.replaceChild(newCancel, dialogCancel);

            dialogConfirm = newConfirm;

            dialogCancel = newCancel;

            dialogTitle.innerText = title;

            dialogMessage.innerText = message;

            if (showInput) { dialogInputContainer.style.display = 'block'; dialogInput.value = inputValue; dialogInput.placeholder = inputPlaceholder; } 

            else dialogInputContainer.style.display = 'none';

            dialogCancel.style.display = showCancel ? 'inline-block' : 'none';

            customDialog.style.display = 'flex';

            function closeDialog() { customDialog.style.display = 'none'; }

            dialogConfirm.addEventListener('click', () => { if (showInput) onConfirm?.(dialogInput.value); else onConfirm?.(); closeDialog(); });

            dialogCancel.addEventListener('click', () => { onCancel?.(); closeDialog(); });

        }

        async function callAI(systemPrompt, userMessage, timeout = 180000) {

                if (confirmed) {

                    // 重置陪伴者设定到默认

                    config.companionName = DEFAULT_CONFIG.companionName;

                    config.companionStyle = DEFAULT_CONFIG.companionStyle;

                    config.companionPrompt = DEFAULT_CONFIG.companionPrompt;

                    config.companionAvatar = DEFAULT_COMPANION_AVATAR; // 改为默认头像

                    // 更新UI

                    companionNameInp.value = config.companionName;

                    companionStyleInp.value = config.companionStyle;

                    companionPromptInp.value = config.companionPrompt;

                    companionAvatarPreview.src = DEFAULT_COMPANION_AVATAR;

                    updateCompanionNameUI();          // 更新界面相关文本（如按钮文字）

                    saveAll();

                    showAlert('陪伴者已恢复默认');

                }

            });

        });

        document.getElementById('resetUserDefaults')?.addEventListener('click', ()=>{

            showConfirm('确定将使用者恢复为默认设置吗？', (confirmed) => {

                if (confirmed) {

                    config.userName = DEFAULT_CONFIG.userName;

                    config.userPrompt = DEFAULT_CONFIG.userPrompt;

                    config.userAvatar = DEFAULT_USER_AVATAR;

                    userNameInp.value = config.userName;

                    userPromptInp.value = config.userPrompt;

                    userAvatarPreview.src = DEFAULT_USER_AVATAR;

                    showAlert('使用者已恢复默认');

        // ========== 主题切换事件绑定 ==========

        themeGreenBtn.addEventListener('click', () => {

            applyTheme('green');

        });

        themeWhiteBtn.addEventListener('click', () => {

            applyTheme('white');

        });

        // ==================== 独立定时器提醒核心函数 ====================

        /**

         * 清除指定任务的定时器

         */

        function clearTaskTimeout(taskId) {

            if (taskTimeouts[taskId]) {

                clearTimeout(taskTimeouts[taskId]);

                delete taskTimeouts[taskId];

            }

        }

        /**

         * 为单个任务设置提醒定时器

         */

        function scheduleReminder(task) {

            if (task.completed) return; // 已完成不提醒

            const now = new Date();

            const [hour, minute] = task.startTime.split(':').map(Number);

            // 基于今天的日期构造任务开始时间

            const taskStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0);

            const remindTime = new Date(taskStart.getTime() - 5 * 60 * 1000); // 提前5分钟

            // 如果提醒时间已过，不再设置定时器

            if (remindTime <= now) return;

            const delay = remindTime.getTime() - now.getTime();

            // 避免设置超大延迟（超过24小时），因为日期可能跨天

            if (delay > 24 * 60 * 60 * 1000) return; // 等待日期变更时重新调度

            clearTaskTimeout(task.id); // 清除旧定时器

            taskTimeouts[task.id] = setTimeout(() => {

                remindTask(task);

                // 触发后从记录中删除

                delete taskTimeouts[task.id];

            }, delay);

        }

        /**

         * 重新调度所有任务的提醒定时器

         */

        function rescheduleAllReminders() {

            // 清除所有现有定时器

            Object.keys(taskTimeouts).forEach(id => clearTaskTimeout(id));

            taskTimeouts = {};

            // 为每个未完成的任务设置定时器

            taskList.forEach(task => scheduleReminder(task));

        }

        /**

         * 执行提醒：调用AI、追加聊天记录、弹出通知

         */

        async function remindTask(task) {

            // 再次检查任务是否已完成（防止等待期间状态变化）

            if (task.completed) return;

            // 1. 调用AI生成提醒消息（短超时10秒）

            const systemPrompt = `你是${config.companionName}，风格：${config.companionStyle}。用户即将开始任务“${task.text}”，请用一句话提醒他/她，语气符合人设，不超过25字。`;

            const userMessage = `提醒我该开始任务了。`;

            let reminderText = '';

            try {

                const aiReply = await callAI(systemPrompt, userMessage, 10000);

                reminderText = aiReply || `${config.companionName}：该开始任务“${task.text}”了。`;

            } catch (err) {

                console.warn('AI提醒失败', err);

                reminderText = `${config.companionName}：该开始任务“${task.text}”了。`; // 降级文本

            }

            // 2. 添加到聊天记录（手机弹窗中）

            chatMessages.push({

                role: 'assistant',

                content: reminderText,

                source: 'chat',

                timestamp: Date.now()

            });

            saveAll();

            // 如果手机弹窗当前是打开状态，立即刷新显示

            if (phoneOverlay && phoneOverlay.style.display === 'flex') {

                renderChatMessages();

            }

            // 3. 弹出系统通知

            if ('Notification' in window && Notification.permission === 'granted') {

                new Notification('收到一条消息', {

                    body: reminderText,

                    icon: config.companionAvatar || '',

                    silent: false

                });

            } else if ('Notification' in window && Notification.permission !== 'denied') {

                Notification.requestPermission();

            }

            // 4. 更新任务的最后提醒时间

            task.lastReminded = Date.now();

            saveAll(); // 再次保存以更新 lastReminded

        }

        // ========== 启动 ==========

        window.onload = async ()=>{

            await migrateOldFontData();

            loadFromStorage();

            await initFontFromDB();

            let now = new Date();

            currentCalendarYear = now.getFullYear();

            currentCalendarMonth = now.getMonth();

            if (config.companionAvatar) bubbleAvatar.src = config.companionAvatar;

            updateTimerDisplay();

            if (phoneHeaderTitle) phoneHeaderTitle.innerText = config.companionName;

            let needSave = false;

            historyRecords.forEach(r => { if (!r.id) { r.id = generateRecordId(); needSave = true; } });

            if (needSave) saveAll();

            // 初始化任务提醒：立即调度一次，并设置日期变更检测

            rescheduleAllReminders();

            // 每分钟检查一次日期是否变化，若变化则重新调度所有任务（处理跨天）

            setInterval(() => {

                const todayStr = new Date().toDateString();

                if (lastDateCheck !== todayStr) {

                    lastDateCheck = todayStr;

                    rescheduleAllReminders();

                }

            }, 60000); // 每分钟检查一次

            // 请求通知权限

            if ('Notification' in window && Notification.permission === 'default') {

                Notification.requestPermission();

            }

        };

    </script>
